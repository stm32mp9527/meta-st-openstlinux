# meta-customer-app layer configuration
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "customer-app"
BBFILE_PATTERN_customer-app = "^${LAYERDIR}/"
BBFILE_PRIORITY_customer-app = "10"

# 按实际 Yocto release 调整；MP1 shuhe 项目当前是 scarthgap
LAYERSERIES_COMPAT_customer-app = "scarthgap"
